<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14264a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>블로그 올리기</title>
<style>
:root{--navy:#14264a;--amber:#f5a623;--bg:#f4f1ea;--card:#fff;--ink:#1b2438;--mute:#6b7487;--line:#e2ddd0;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1730;--card:#17223f;--ink:#eef0f6;--mute:#9aa4bd;--line:#2a3860}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
header h1{margin:0;font-size:17px}header small{color:#b9c4e0;font-size:12px}
main{padding:16px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:13px;color:var(--mute);font-weight:500}
.row span.v{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;min-height:48px;background:var(--navy);color:#fff;font-weight:700}
button.cp{flex:none;min-width:84px}
button.done{background:var(--ok)}
button.big{width:100%;background:var(--amber);color:var(--navy);font-size:17px;min-height:56px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
ol{padding-left:20px;margin:6px 0;font-size:15px}
.hint{font-size:13px;color:var(--mute)}
details summary{cursor:pointer;font-weight:600}
.prev{font-size:15px;margin-top:8px}.prev table{border-collapse:collapse;width:100%;font-size:13px}.prev td,.prev th{border:1px solid var(--line);padding:4px 6px}.prev blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--amber);color:var(--mute)}
input,textarea{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 8px}
textarea{min-height:160px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>연필 차장의 행복 계산 일지</h1><small>네이버 블로그 비공개 초안 올리기</small></header>
<main>
<div id="empty" class="card" hidden>
 <b>열린 글이 없습니다.</b>
 <p class="hint">Claude 대화에서 받은 링크로 열어 주세요. 직접 올리려면 아래에 붙여넣습니다.</p>
 <input id="mt" placeholder="제목"><textarea id="mb" placeholder="본문"></textarea><input id="mg" placeholder="태그 (쉼표로 구분)">
 <button class="big" onclick="manual()">이 내용으로 열기</button>
</div>
<div id="post" hidden>
 <div class="card"><div class="row"><div class="t"><b>제목</b><span class="v" id="vt"></span></div><button class="cp" data-k="t" onclick="cpTitle(this)">복사</button></div></div>
 <div class="card"><div class="row"><div class="t"><b>본문 <span id="vl"></span></b><span class="v" id="vb"></span></div><button class="cp" data-k="b" onclick="cpBody(this)">복사</button></div>
  <p class="hint" style="margin:8px 0 0">표·굵게 등 서식 포함으로 복사됩니다. 서식이 깨지면 <a href="#" onclick="cpPlain(event)">텍스트로 복사</a>를 쓰세요.</p></div>
 <div class="card"><div class="row"><div class="t"><b>태그</b><span class="v" id="vg"></span></div><button class="cp" data-k="g" onclick="cpTags(this)">복사</button></div></div>
 <button class="big" onclick="openNaver()">네이버 블로그 앱 열기</button>
 <div class="card" style="margin-top:12px">
  <ol>
   <li>위에서 <b>제목</b>을 복사하고 앱 글쓰기에 붙여넣기</li>
   <li><b>본문</b>을 복사해 본문에 붙여넣기</li>
   <li>카테고리 <b id="vc"></b> 선택, <b>태그</b> 복사해 붙여넣기</li>
   <li>발행 설정을 <b>비공개</b>로 하고 저장</li>
  </ol>
 </div>
 <div class="card"><details><summary>본문 미리보기</summary><div class="prev" id="prev"></div></details></div>
</div>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);let P=null;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500)}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2">$1</a>')}
function md(src){const L=src.replace(/\r/g,'').split('\n'),o=[];let i=0;
 while(i<L.length){const l=L[i];
  if(/^\s*$/.test(l)){i++;continue}
  let m;
  if(m=l.match(/^(#{1,4})\s+(.*)/)){const n=Math.min(m[1].length+1,4);o.push(`<h${n}>${inline(m[2])}</h${n}>`);i++}
  else if(/^---+\s*$/.test(l)){o.push('<hr>');i++}
  else if(/^>/.test(l)){const b=[];let cur=[];while(i<L.length&&/^>/.test(L[i])){const t=L[i++].replace(/^>\s?/,'');if(t.trim()===''){if(cur.length)b.push(cur.join('<br>'));cur=[]}else cur.push(inline(t))}if(cur.length)b.push(cur.join('<br>'));o.push('<blockquote>'+b.map(x=>`<p>${x}</p>`).join('')+'</blockquote>')}
  else if(/^\|/.test(l)){const r=[];while(i<L.length&&/^\|/.test(L[i]))r.push(L[i++]);const rows=r.filter(x=>!/^\|[\s:|-]+\|?\s*$/.test(x)).map(x=>x.replace(/^\||\|\s*$/g,'').split('|').map(c=>c.trim()));
   o.push('<table>'+rows.map((c,k)=>'<tr>'+c.map(v=>`<${k?'td':'th'}>${inline(v)}</${k?'td':'th'}>`).join('')+'</tr>').join('')+'</table>')}
  else if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ord=/^\s*\d+\./.test(l),b=[];while(i<L.length&&/^\s*([-*]|\d+\.)\s+/.test(L[i]))b.push(`<li>${inline(L[i++].replace(/^\s*([-*]|\d+\.)\s+/,''))}</li>`);o.push(`<${ord?'ol':'ul'}>${b.join('')}</${ord?'ol':'ul'}>`)}
  else{const p=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#|>|\||---)/.test(L[i]))p.push(inline(L[i++]));o.push(`<p>${p.join('<br>')}</p>`)}}
 return o.join('')}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}
function mark(b){b.classList.add('done');b.textContent='복사됨 ✓'}
async function cpTitle(b){await copy(P.t);mark(b);toast('제목 복사됨')}
async function cpTags(b){await copy(P.g.map(x=>'#'+x).join(' '));mark(b);toast('태그 복사됨')}
async function cpBody(b){const html=md(P.b);
 try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([P.b],{type:'text/plain'})})]);toast('본문 복사됨 (서식 포함)')}catch(e){await copy(P.b);toast('본문 복사됨 (텍스트)')}
 mark(b)}
async function cpPlain(e){e.preventDefault();await copy(P.b);mark(document.querySelector('[data-k=b]'));toast('본문 복사됨 (텍스트)')}
function openNaver(){const fb=encodeURIComponent('https://m.blog.naver.com/');location.href='intent://#Intent;scheme=naverblog;package=com.nhn.android.blog;S.browser_fallback_url='+fb+';end'}
function show(p){P=p;$('#empty').hidden=true;$('#post').hidden=false;$('#vt').textContent=p.t;$('#vb').textContent=p.b.replace(/\s+/g,' ').slice(0,50)+'…';$('#vl').textContent='('+p.b.length.toLocaleString()+'자)';$('#vg').textContent=p.g.map(x=>'#'+x).join(' ');$('#vc').textContent=p.c||'';$('#prev').innerHTML=md(p.b);document.title=p.t}
function manual(){const t=$('#mt').value.trim(),b=$('#mb').value.trim();if(!t||!b){toast('제목과 본문을 넣어 주세요');return}show({t,b,g:$('#mg').value.split(/[,\s#]+/).filter(Boolean).slice(0,10),c:''})}
async function inflate(b64){const s=atob(b64.replace(/-/g,'+').replace(/_/g,'/')),u=Uint8Array.from(s,c=>c.charCodeAt(0));const r=new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')));return JSON.parse(await r.text())}
(async()=>{const m=location.hash.match(/d=([A-Za-z0-9_-]+)/);
 if(m){try{show(await inflate(m[1]));return}catch(e){toast('링크를 읽지 못했습니다')}}
 $('#empty').hidden=false})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
